# Límites de peticiones de Cursenda (va en /etc/nginx/conf.d/)
limit_req_zone $binary_remote_addr zone=cursenda_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=cursenda_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=cursenda_forms:10m rate=10r/m;

upstream cursenda_app {
    server unix:/run/cursenda/cursenda.sock;
    keepalive 16;
}
