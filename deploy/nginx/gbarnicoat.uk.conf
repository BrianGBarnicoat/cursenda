# Web de Cursenda en cursenda.es (va en /etc/nginx/sites-available/)
server {
    server_name cursenda.es;

    server_tokens off;
    client_max_body_size 256k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/javascript application/javascript text/css application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;

    # Login: 5 intentos por minuto y por IP
    location = /api/auth/login {
        limit_req zone=cursenda_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://cursenda_app;
    }

    # Formularios públicos (solicitudes de alumnos, activación de cuentas)
    location ~ ^/api/(public/solicitudes|public/demo|auth/register-invitation|auth/recuperar|auth/restablecer|auth/activar-miembro)$ {
        limit_req zone=cursenda_forms burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://cursenda_app;
    }

    location /api/ {
        limit_req zone=cursenda_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://cursenda_app;
    }

    # Archivos con hash en el nombre: caché de un año
    location /assets/ {
        proxy_pass http://cursenda_app;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Bloquear archivos ocultos y de configuración
    location ~ /\.(?!well-known) {
        return 404;
    }

    location / {
        proxy_pass http://cursenda_app;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/cursenda.es/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/cursenda.es/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# www y el dominio antiguo llevan a cursenda.es
server {
    server_name www.cursenda.es;
    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/cursenda.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cursenda.es/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://cursenda.es$request_uri;
}

server {
    server_name gbarnicoat.uk;
    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/gbarnicoat.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gbarnicoat.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://cursenda.es$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name cursenda.es www.cursenda.es gbarnicoat.uk;
    return 301 https://cursenda.es$request_uri;
}
